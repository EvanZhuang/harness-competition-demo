# The serve-mode demo harness (portal/SERVE.md). As written it calls the portal's model (Claude Opus 5.5) through the
# evaluator's proxy; to call your own model, see README.md.
name: serve-demo
source:
  repo: https://github.com/OWNER/REPO        # the submit form fills source from the repository you pick
  ref: "0000000000000000000000000000000000000000"
run:
  # Once, with internet, in the builder container: a uv-managed Python 3.12 venv under /opt/harness.
  install: >-
    uv venv --python 3.12 /opt/harness/venv
    && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve:
  command: "/opt/harness/venv/bin/python {src}/serve.py --port {port}"
  egress: []
model: "claude-opus-5-5 (portal)"
env:
  MODEL_API: "anthropic"
  MODEL: "claude-opus-5-5"
  ANTHROPIC_BASE_URL: "{proxy_url}"
  ANTHROPIC_API_KEY: "{proxy_key}"
